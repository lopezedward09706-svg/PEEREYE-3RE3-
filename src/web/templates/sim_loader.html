<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PEEREYE: Inyectando Simulación Externa</title>
    <style>
        body { background: #000; color: #3fb950; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
        .spinner { border: 4px solid rgba(63, 185, 80, 0.3); width: 50px; height: 50px; border-radius: 50%; border-left-color: #3fb950; animation: spin 1s linear infinite; margin-bottom: 20px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        setTimeout(() => {
            window.location.href = "{{ sim_url }}";
        }, 8000); // Dar 8 segundos al servidor de Node para instalar e iniciar
    </script>
</head>
<body>
    <div class="spinner"></div>
    <h2>INICIANDO MATRIZ DE SIMULACIÓN EXTERNA (VITE/REACT)</h2>
    <p>Compilando dependencias e iniciando motor Node.js...</p>
    <p>Serás redirigido automáticamente a la pestaña de simulación ({{ sim_url }}).</p>
</body>
</html>
